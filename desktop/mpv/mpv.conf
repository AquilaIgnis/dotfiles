#https://github.com/Tsubajashi/mpv-settings

###########
# GPU API #
###########

gpu-api=opengl

##########
# Player #
##########

#input-ipc-server=/tmp/mpvsocket
hr-seek-framedrop=no
no-resume-playback
border=no
msg-color=yes
msg-module=yes

###### General
# fullscreen=yes
keep-open=always
autofit=85%x85%
cursor-autohide=100
force-window=yes
audio-display=embedded-first
cover-art-auto=all

###############
# Screenshots #
###############

screenshot-template="%x/Screens/Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"
screenshot-format=png
screenshot-png-compression=4
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes

###########
# OSC/OSD #
###########

osc=no
osd-bar=yes
osd-font='Inter Tight Medium'
osd-font-size=30
osd-color='#CCFFFFFF'
osd-border-color='#DD322640'
osd-bar-align-y=-1
osd-border-size=2
osd-bar-h=1
osd-bar-w=60

########
# Subs #
########

blend-subtitles=no
sub-ass-scale-with-window=no
sub-auto=fuzzy
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles
demuxer-mkv-subtitle-preroll=yes
embeddedfonts=yes
sub-fix-timing=no

# Subs - Forced #

sub-font=Open Sans SemiBold
sub-font-size=46
sub-blur=0.3
sub-border-color=0.0/0.0/0.0/0.8
sub-border-size=3.2
sub-color=0.9/0.9/0.9/1.0
sub-margin-x=100
sub-margin-y=50
sub-shadow-color=0.0/0.0/0.0/0.25
sub-shadow-offset=0

#########
# Audio #
#########
ao=alsa
audio-device=auto
volume-max=200
audio-stream-silence                        # fix audio popping on random seek
audio-file-auto=fuzzy                       # external audio doesn't has to match the file name exactly to autoload
audio-pitch-correction=yes                  # automatically insert scaletempo when playing with higher speed

# Languages #
alang=jpn,jp,eng,en,enUS,en-US,de,ger		# Audio language priority
slang=eng,en,und,de,ger,jp,jap 			    # Subtitle language priority

##################
# Video Profiles #
##################

profile=high-quality			# mpv --show-profile=gpu-hq
hwdec=auto-copy
vo=gpu-next

####### Dither
dither-depth=auto

####### Debanding
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4



####### HDR
#target-colorspace-hint=yes

#############
## Playback #
#############

#deinterlace=no # global reset of deinterlacing to off

[default]
# apply all luma and chroma upscaling and downscaling settings
# apply motion interpolation

############################
# Protocol Specific Config #
############################

[protocol.http]
hls-bitrate=max
cache=yes
no-cache-pause

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
